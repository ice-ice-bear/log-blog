chrome:
  # Option A — filter by folder name (classic):
  profiles: ["Default"]
  # Option B — filter by Google account email (recommended, human-readable):
  # google_accounts: ["work@company.com", "personal@gmail.com"]
  # If google_accounts is set it overrides profiles.
  # Run 'uv run log-blog profiles' to see all profiles and their emails.
  history_db_base: "~/Library/Application Support/Google/Chrome"

time_range_hours: 24

blog:
  repo_path: "~/Documents/github/your-blog-repo"  # REQUIRED: local path to your Hugo blog repo
  repo_url: "https://github.com/your-user/your-blog-repo.git"  # Used to clone if repo_path doesn't exist
  content_dir: "content/posts"            # fallback when no language match
  language_content_dirs: {}               # Hugo multi-language: e.g. {ko: "content/ko/posts", en: "content/en/posts"}
  default_language: "en"                  # used when --language is not specified
  language: "auto"  # post language detection: "auto" (detect from Chrome), "ko", "en"

playwright:
  headless: true
  timeout_ms: 15000
  max_concurrent: 5
  cdp_port: 9222       # Chrome DevTools Protocol port for authenticated AI chat fetching

# Account credentials for enriched content fetching.
# Tokens support ${ENV_VAR} syntax — the actual secret is read from your shell environment
# at runtime, so config.yaml itself never contains raw credentials.
#
# Recommended setup: add to ~/.zshrc or ~/.bash_profile:
#   export BITBUCKET_APP_PASSWORD="your-app-password"
accounts:
  github:
    # Optional. Only needed if you have multiple GitHub accounts in gh CLI.
    # Run 'gh auth status' to see available profiles.
    # If set, runs 'gh auth switch --user {profile}' before every GitHub fetch.
    profile: ""

  bitbucket:
    username: ""         # Your Bitbucket username (e.g. "myuser")
    token: "${BITBUCKET_APP_PASSWORD}"  # App Password from bitbucket.org → Settings → App passwords

  # Per-service AI chat settings.
  # Authenticated fetching connects to your running Chrome via CDP (DevTools Protocol).
  # Launch Chrome with: --remote-debugging-port=9222
  # auth_profile: Label for the Chrome account logged into the service.
  #               Leave empty ("") to fall back to unauthenticated Playwright.
  # enabled: false skips the service entirely (its URLs won't be fetched at all).
  ai_chats:
    perplexity:
      auth_profile: ""   # e.g. "user@example.com"
      enabled: true
    chatgpt:
      auth_profile: ""   # e.g. "user@example.com"
      enabled: true
    claude:
      auth_profile: ""   # e.g. "user@example.com"
      enabled: true
    gemini:
      auth_profile: ""   # e.g. "user@example.com" — Chrome account logged into gemini.google.com
      enabled: true

# Image handling for blog posts.
# Cover images are generated locally using Pillow (gradient + title + tags).
# Taxonomy icons are sourced from Simple Icons / Tabler Icons CDN.
images:
  cover_enabled: true       # Set false to skip cover image generation
  taxonomy_enabled: true    # Set false to skip tag/category icon management
  # cover_font_path: ""     # Optional: custom font path (default: auto-detect Korean system font)

# Claude Code session parsing for dev log blog posts.
# Sessions are auto-discovered from ~/.claude/projects/ by default.
sessions:
  claude_dir: "~/.claude/projects"  # Where Claude Code stores session transcripts
  # projects:                       # Optional overrides for auto-discovery (parsed manually)
  #   custom-name:
  #     session_dir: "~/.claude/projects/-Users-you-some-project-path"
  #     repo_path: "~/Documents/actual/repo/path"

# Firecrawl deep docs fetching (optional).
# When enabled, documentation URLs can be deep-crawled to fetch sub-pages
# for more comprehensive blog posts. Get an API key at https://firecrawl.dev
firecrawl:
  api_key: "${FIRECRAWL_API_KEY}"  # Leave empty or unset to disable deep docs
  max_pages: 10                     # Max pages to crawl per documentation URL
