[project]
name = "log-blog"
version = "0.2.6"
description = "Browser history to tech blog pipeline"
requires-python = ">=3.12"
dependencies = [
    "firecrawl-py",
    "pillow",
    "playwright",
    "pyyaml",
    "rich",
    "youtube-transcript-api",
]

[project.scripts]
log-blog = "log_blog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_blog"]

[project.optional-dependencies]
dev = ["pytest"]
