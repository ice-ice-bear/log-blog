[project]
name = "log-blog"
version = "0.1.0"
description = "Browser history to tech blog pipeline"
requires-python = ">=3.12"
dependencies = [
    "playwright",
    "pyyaml",
    "rich",
]

[project.scripts]
log-blog = "log_blog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_blog"]
